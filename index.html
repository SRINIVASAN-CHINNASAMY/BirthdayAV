<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Our Journey</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>

<style>
/* =====================================================================
   EDIT YOUR CONTENT — everything you'd want to personalize lives in the
   big CONFIG object near the top of the <script> at the bottom of this
   file: names, the proposal note, the birthday message, cover titles,
   your photos and your song. Nothing below CONFIG needs to change.

   QUICK MAP OF WHAT TO EDIT WHERE (all inside CONFIG, in the <script>):
   - CONFIG.gate                -> the "ask a friend's name" question, tip,
                                    accepted names and their two responses
   - CONFIG.backgroundMusicSrc  -> optional whole-site background music file
   - CONFIG.pageBackgrounds     -> optional full-page background image per page
   - CONFIG.photos              -> your gallery images + captions
   - CONFIG.galleryMusicSrc     -> music that plays under the photo gallery
   - CONFIG.musicTrack          -> "Our Song" title / artist / audio file
   - CONFIG.finalMessage/Sign   -> the closing birthday message + signature
   - every other CONFIG.* field -> the wording shown on that specific page

   ADDING YOUR OWN PHOTOS & MUSIC:
   This file now expects your media to live in a local "assets" folder
   next to this HTML file, so it works reliably on GitHub / GitHub Pages
   (no more Google Drive links, which Google actively blocks for audio).
   Folder layout expected:
     assets/
       images/
         photo-01.jpg ... photo-10.jpg   (the 10 gallery photos)
         gate-background.jpg             (optional, gate page background)
         finale-background.jpg           (optional, finale page background)
       audio/
         gallery-music.mp3               (plays during the photo gallery)
         our-song.mp3                    (the "Our Song" page track)
         background-music.mp3            (optional, whole-site music)
   Just drop files in with those exact names (or update the filenames in
   CONFIG below to match whatever you name your files) and push to GitHub.

   NOTE ON BACKGROUNDS: there's no real photo behind each page — this
   build has no image-generation tool available, so instead every page
   gets a procedurally drawn "painterly glow" scene: a soft 3D icon
   (heart / cake / frame / vinyl / firework) rendered with Three.js,
   resting on a glass hexagonal pedestal, floating in a blurred field
   of glowing bokeh and faint connecting lines — the same soft-glow,
   shallow-depth-of-field mood you described, generated in code rather
   than a static picture. Fill in CONFIG.pageBackgrounds with your own
   photo URL for any page and it will be used instead automatically.
===================================================================== */

:root{
  --rose-deep:#1a040a;
  --wine:#33101c;
  --champagne:#e8c77e;
  --gold:#ffd98e;
  --gold-dim:#b98f4a;
  --blush:#f2a6b3;
  --cream:#f7ecd9;
  --ink:#2b1710;
  --glass-bg:rgba(251,243,231,0.06);
  --glass-brd:rgba(232,199,126,0.28);
  --shadow:0 20px 60px rgba(0,0,0,0.45);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overscroll-behavior:none;}
body{font-family:'Cormorant Garamond',serif;background:var(--rose-deep);color:var(--cream);overflow:hidden;perspective:1600px;}
h1,h2,h3,.display{font-family:'Playfair Display',serif;letter-spacing:.01em;}
.ui-font{font-family:'Inter',sans-serif;}
::selection{background:var(--gold);color:var(--rose-deep);}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
img{max-width:100%;display:block;}

#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#bg-gradient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(232,199,126,0.10), transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 110%, rgba(74,21,38,0.55), transparent 60%),
    linear-gradient(180deg, var(--rose-deep), var(--wine) 55%, var(--rose-deep));
  transition:filter 1.4s var(--ease);
}

/* ============================ SCREENS ============================ */
.screen{
  position:fixed; inset:0; z-index:1;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  padding:6vh 6vw;
  opacity:0; pointer-events:none;
  transform:translateY(46px) scale(0.95);
  transform-origin:50% 100%;
  transition:opacity .85s var(--ease), transform .85s var(--ease);
  overflow:hidden;
}
.screen.active{opacity:1; pointer-events:auto; transform:translateY(0) scale(1); z-index:5;}
.screen.leaving{transform:translateY(-40px) scale(0.96); opacity:0; z-index:4;}

/* ---- procedurally generated atmosphere (bokeh + network + glow) ---- */
.atmos{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.atmos svg{position:absolute; inset:0; width:100%; height:100%; filter:blur(1.5px); opacity:.28;}
.bokeh{position:absolute; border-radius:50%; filter:blur(20px); opacity:.4; animation:bokehFloat linear infinite;}
@keyframes bokehFloat{0%{transform:translateY(0) translateX(0);}50%{transform:translateY(-24px) translateX(14px);}100%{transform:translateY(0) translateX(0);}}

/* ---- cover screens ---- */
.cover-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px;}
.icon-stage{position:relative; width:230px; height:230px; margin-bottom:2px; display:flex; align-items:center; justify-content:center;}
.icon-stage canvas{position:relative; z-index:2; filter:drop-shadow(0 12px 26px rgba(0,0,0,0.45)) drop-shadow(0 0 44px rgba(255,217,142,0.35));}
.hex-pedestal{
  position:absolute; bottom:6px; width:178px; height:100px; z-index:1;
  background:linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,217,142,0.05));
  clip-path:polygon(25% 4%,75% 4%,98% 50%,75% 96%,25% 96%,2% 50%);
  border:1px solid rgba(255,217,142,0.35);
  backdrop-filter:blur(6px);
  box-shadow:0 24px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
  opacity:.9;
}
.cover-content h1{font-size:clamp(32px,6vw,58px); min-height:1.2em;}
.cover-content .cover-sub{font-size:18px; color:var(--champagne); opacity:.9; min-height:1.6em; font-style:italic; max-width:560px;}
.cover-content .enter-btn{margin-top:26px;}
.cover-content .cover-hint{margin-top:14px; display:block; font-size:11px; letter-spacing:.25em; text-transform:uppercase; opacity:.5; animation:pulseHint 2.2s ease-in-out infinite;}
.cover-content .reveal-group{margin-top:10px;}
@keyframes pulseHint{0%,100%{opacity:.35;}50%{opacity:.7;}}
.typing-cursor{display:inline-block;width:2px;height:0.95em;background:var(--gold);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* ============================ REVEAL-AFTER-TYPING (buttons only appear once the writing is done) ============================ */
.reveal-group{opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .6s var(--ease), transform .6s var(--ease);}
.reveal-group.show{opacity:1;transform:translateY(0);pointer-events:auto;}

/* ============================ GATE SCREEN (asks a friend's name before the site opens) ============================ */
.gate-screen{z-index:20;}
.gate-tip{font-size:13px;color:var(--champagne);opacity:.7;margin-top:10px;font-style:italic;}
.gate-input-row{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;}
.gate-input{font-family:'Inter',sans-serif;font-size:15px;padding:13px 20px;border-radius:100px;border:1px solid var(--glass-brd);background:rgba(251,243,231,0.07);color:var(--cream);min-width:220px;text-align:center;outline:none;transition:border-color .3s var(--ease), background .3s var(--ease);}
.gate-input::placeholder{color:rgba(247,236,217,0.4);}
.gate-input:focus{border-color:var(--gold);background:rgba(251,243,231,0.12);}
.gate-response{margin-top:22px;font-size:18px;color:var(--gold);min-height:1.6em;font-style:italic;}

/* ============================ PER-PAGE BACKGROUND IMAGE LAYER ============================ */
/* If you set an image for a page in CONFIG.pageBackgrounds, it is drawn full-bleed
   here, behind that page's content, with a soft dark gradient over it so text stays
   readable. Leave a page's entry blank/"" to keep the default glowing design. */
#page-bg-layer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s var(--ease);pointer-events:none;}
#page-bg-layer.show{opacity:.5;}
#page-bg-layer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(26,4,10,0.55), rgba(51,16,28,0.72) 55%, rgba(26,4,10,0.88));}

/* ============================ GLOBAL BACKGROUND MUSIC TOGGLE ============================ */
/* Shows on every page (top-left) whenever CONFIG.backgroundMusicSrc is filled in. */
#bgMusicToggle{position:fixed;top:22px;left:22px;z-index:200;font-size:12px;letter-spacing:.05em;padding:10px 18px;border-radius:100px;background:rgba(26,4,10,0.5);border:1px solid var(--glass-brd);color:var(--cream);backdrop-filter:blur(8px);transition:transform .3s var(--ease), border-color .3s var(--ease);}
#bgMusicToggle:hover{transform:translateY(-2px);border-color:var(--gold);}
@media (max-width:640px){#bgMusicToggle{top:14px;left:14px;padding:8px 14px;font-size:11px;}}

/* ============================ NAV DOTS ============================ */
#nav-dots{position:fixed; right:22px; top:50%; transform:translateY(-50%); z-index:150; display:flex; flex-direction:column; gap:16px;}
#nav-dots button{width:9px;height:9px;border-radius:50%;background:rgba(247,236,217,0.28);border:1px solid transparent;transition:all .4s var(--ease); position:relative;}
#nav-dots button::after{content:attr(data-label);position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--champagne);opacity:0;transition:opacity .3s var(--ease);pointer-events:none;}
#nav-dots button:hover::after{opacity:1;}
#nav-dots button.active{background:var(--gold);box-shadow:0 0 12px 2px rgba(255,217,142,0.7);transform:scale(1.3);}
@media (max-width:720px){#nav-dots{display:none;}}

/* ============================ SHARED UI ============================ */
.eyebrow{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--champagne);opacity:.85;margin-bottom:14px;display:block;}
.glass-panel{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);}
.btn{padding:15px 38px;border-radius:100px;font-size:14px;letter-spacing:.05em;font-weight:500;transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--ink);box-shadow:0 8px 30px rgba(255,217,142,0.35);}
.btn-gold:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 40px rgba(255,217,142,0.5);}
.btn-ghost{background:transparent;border:1px solid var(--glass-brd);color:var(--cream);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.cta-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.shimmer-text{background:linear-gradient(100deg,var(--gold-dim) 20%,var(--gold) 40%,#fff8e6 50%,var(--gold) 60%,var(--gold-dim) 80%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite;}
@keyframes shimmer{to{background-position:-250% center;}}

/* ============================ BIG EMOJI REACTION ============================ */
#bigEmojiOverlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.big-emoji{opacity:0;font-size:20vw;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.5));}
.big-emoji.show{animation:bigEmojiPop 1.7s var(--ease) forwards;}
@keyframes bigEmojiPop{0%{opacity:0;transform:scale(.15) rotate(-20deg);}22%{opacity:1;transform:scale(1.2) rotate(6deg);}38%{transform:scale(.92) rotate(-3deg);}50%{transform:scale(1.06) rotate(2deg);}78%{opacity:1;transform:scale(1) rotate(0deg);}100%{opacity:0;transform:scale(1.35) rotate(0deg);}}
.mascot{position:fixed;bottom:-120px;left:50%;transform:translateX(-50%);font-size:64px;z-index:60;transition:bottom 1s var(--ease);pointer-events:none;}
.mascot.show{bottom:6vh;animation:jump 1.1s var(--ease) .2s 2;}
@keyframes jump{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-26px);}}
.dance-row{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:40px;font-size:46px;pointer-events:none;z-index:55;opacity:0;transition:opacity .5s var(--ease);}
.dance-row.show{opacity:1;}
.dance-row span{animation:dance .9s ease-in-out infinite;display:inline-block;transform-origin:bottom center;}
.dance-row span:nth-child(2){animation-delay:.15s;}
.dance-row span:nth-child(3){animation-delay:.3s;}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-18px) rotate(6deg);}}

/* ============================ PROPOSAL SCREEN ============================ */
.scroll-frame{width:min(560px,90vw);max-height:78vh;overflow-y:auto;padding:56px 46px 46px;position:relative;z-index:2;}
.scroll-frame::-webkit-scrollbar{width:6px;}
.scroll-frame::-webkit-scrollbar-thumb{background:var(--glass-brd);border-radius:100px;}
.scroll-frame::before{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;background:linear-gradient(160deg,rgba(255,217,142,.6),transparent 40%,rgba(242,166,179,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
#proposal-question{font-size:clamp(26px,4.2vw,40px);font-weight:600;margin:6px 0 18px;line-height:1.2;min-height:2.4em;}
#proposal-note{font-size:19px;line-height:1.75;color:rgba(247,236,217,0.88);min-height:5.5em;font-style:italic;}
/* Buttons are pinned to the top-right of the whole screen (not inside the
   scrolling note panel) so a long note can never push them out of view. */
.proposal-buttons{position:absolute;top:26px;right:26px;margin-top:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;height:auto;z-index:50;}
.proposal-buttons .btn{padding:12px 26px;font-size:13px;}
#btn-no{position:relative;transition:transform .35s var(--ease);}
#no-wink{display:block;text-align:right;font-size:13px;color:var(--blush);opacity:0;transition:opacity .3s var(--ease);white-space:nowrap;max-width:200px;}
#no-wink.show{opacity:1;}
@media (max-width:640px){
  .proposal-buttons{top:14px;right:14px;gap:8px;}
  .proposal-buttons .btn{padding:9px 18px;font-size:11px;}
  #no-wink{font-size:11px;max-width:150px;}
}
#yes-reveal{margin-top:26px;font-size:20px;color:var(--gold);opacity:0;transform:translateY(10px);transition:all .6s var(--ease);}
#yes-reveal.show{opacity:1;transform:translateY(0);}

/* ============================ CAKE SCREEN ============================ */
.cake-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;}
.pedestal{width:min(230px,50vw);height:16px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(232,199,126,0.5),rgba(232,199,126,0.05) 70%);margin-top:6px;filter:blur(1px);}
.cake{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 30px 40px rgba(0,0,0,0.5));transform-style:preserve-3d;animation:cakeSway 7s ease-in-out infinite;}
@keyframes cakeSway{0%,100%{transform:rotateY(-4deg);}50%{transform:rotateY(4deg);}}
.tier{border-radius:14px;background:linear-gradient(180deg,#fff6e6 0%,#f4dcae 55%,#e6c589 100%);position:relative;box-shadow:inset 0 -8px 14px rgba(184,140,70,0.35),inset 0 6px 10px rgba(255,255,255,0.6);}
.tier::after{content:"";position:absolute;left:0;right:0;top:-8px;height:16px;border-radius:50%;background:linear-gradient(180deg,#fffaf0,#f4dcae);}
.tier1{width:250px;height:80px;} .tier2{width:190px;height:70px;margin-top:-4px;} .tier3{width:130px;height:60px;margin-top:-4px;}
.drip{position:absolute;bottom:-10px;left:0;right:0;height:20px;background:radial-gradient(circle at 15% 0, transparent 8px, var(--gold) 9px) 0 0/30px 20px repeat-x;opacity:.85;}
.candles{display:flex;gap:14px;margin-bottom:-6px;position:relative;z-index:2;}
.candle{width:8px;height:46px;background:repeating-linear-gradient(180deg,var(--blush) 0 6px,#fff 6px 12px);border-radius:3px;position:relative;cursor:pointer;transform-origin:bottom center;}
.candle .flame{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:12px;height:20px;background:radial-gradient(ellipse at 50% 70%,#fff6c9 0%,#ffcf5a 35%,#ff8a3d 70%,transparent 75%);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;animation:flicker 1.6s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,180,80,0.9));transition:opacity .3s, transform .3s;}
.candle.out .flame{opacity:0;transform:translateX(-50%) scale(.3);}
.candle .smoke{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:rgba(230,230,230,0.5);opacity:0;pointer-events:none;}
.candle.out .smoke{animation:smoke-rise 1.4s ease-out forwards;}
@keyframes flicker{0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg);}50%{transform:translateX(-50%) scale(1.12,0.94) rotate(3deg);}}
@keyframes smoke-rise{0%{opacity:.6;transform:translate(-50%,0) scale(1);}100%{opacity:0;transform:translate(-50%,-40px) scale(4);}}
.cake-caption{margin-top:30px;text-align:center;}
.cake-caption h2{font-size:clamp(22px,3.4vw,30px);margin-bottom:8px;min-height:1.3em;}
#cake-hint{color:var(--champagne);font-size:15px;opacity:.85;min-height:1.4em;}
#cake-cta{margin-top:26px;opacity:0;transform:translateY(14px);transition:all .6s var(--ease);pointer-events:none;}
#cake-cta.show{opacity:1;transform:translateY(0);pointer-events:auto;}

/* ============================ GALLERY / CINEMATIC SLIDESHOW ============================ */
#gallery{padding:0;}
.slideshow{position:relative;z-index:2;position:absolute;inset:0;overflow:hidden;background:#050102;}
.slide-layer{
  position:absolute;inset:0;
  background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#050102;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  color:var(--champagne); font-family:'Inter',sans-serif; text-align:center; padding:10vw;
  opacity:0; will-change:transform,filter,opacity;
}
/* slow continuous zoom applied while a photo is on screen, so the gallery
   plays like a running video (a "Ken Burns" pan/zoom) instead of a static slide */
.slide-layer.is-placeholder{padding:10vw;}
.slide-layer.is-placeholder{opacity:1;}
.slide-layer svg{width:52px;height:52px;opacity:.75;}
.slide-scrim{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(0deg, rgba(5,1,2,0.8) 0%, rgba(5,1,2,0.05) 30%, transparent 52%, rgba(5,1,2,0.4) 100%);}
.slide-caption{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:4;font-size:clamp(19px,2.8vw,28px);padding:0 8vw;min-height:1.5em;text-shadow:0 4px 20px rgba(0,0,0,0.7);opacity:0;transition:opacity .3s ease;}
.slide-counter{position:absolute;top:26px;left:50%;transform:translateX(-50%);z-index:4;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.2em;color:var(--champagne);opacity:.85;}
.slide-controls{position:absolute;bottom:32px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;z-index:4;}
.slide-btn{width:44px;height:44px;border-radius:50%;background:rgba(26,4,10,0.5);border:1px solid var(--glass-brd);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:15px;backdrop-filter:blur(6px);transition:transform .3s var(--ease), background .3s;}
.slide-btn:hover{transform:scale(1.1);background:rgba(26,4,10,0.75);}
.slide-progress{position:absolute;top:0;left:0;right:0;height:3px;z-index:4;display:flex;gap:3px;padding:10px 14px 0;}
.slide-progress i{flex:1;height:3px;background:rgba(255,255,255,0.22);border-radius:2px;overflow:hidden;position:relative;font-style:normal;}
.slide-progress i b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);display:block;}
.slide-progress i.done b{width:100%;transition:none;}
.checkpoint-overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(10,2,5,0.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s var(--ease);text-align:center;}
.checkpoint-overlay.show{opacity:1;pointer-events:auto;}
.checkpoint-overlay .inner{max-width:480px;padding:20px;}
.checkpoint-overlay p{font-size:24px;margin-bottom:24px;color:var(--cream);min-height:1.4em;}
#checkpoint-response{margin-top:18px;font-size:16px;color:var(--blush);min-height:1.4em;}

/* ============================ MUSIC SCREEN ============================ */
.player-shell{position:relative;z-index:2;width:min(420px,90vw);padding:40px 36px 34px;text-align:center;}
.vinyl-wrap{position:relative;width:210px;height:210px;margin:0 auto 26px;}
.vinyl{width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle at center,#0c0c0e 0 2px,#1b1b1f 2px 4px),radial-gradient(circle at 35% 30%,rgba(255,255,255,0.12),transparent 45%);box-shadow:0 20px 50px rgba(0,0,0,0.6),inset 0 0 0 6px rgba(255,255,255,0.03);position:relative;animation:spin 6s linear infinite;animation-play-state:paused;}
.vinyl.playing{animation-play-state:running;}
.vinyl-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,var(--gold-dim) 75%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.4);}
.vinyl-label::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);}
@keyframes spin{to{transform:rotate(360deg);}}
.tonearm{position:absolute;top:-14px;right:-6px;width:80px;height:80px;transform-origin:80% 20%;transform:rotate(-28deg);transition:transform .6s var(--ease);pointer-events:none;}
.tonearm.playing{transform:rotate(0deg);}
.tonearm::before{content:"";position:absolute;top:14px;left:6px;width:5px;height:70px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--gold-dim));transform:rotate(35deg);transform-origin:top center;}
.tonearm::after{content:"";position:absolute;top:8px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--gold-dim);}
#track-title{font-size:23px;margin-top:4px;min-height:1.3em;}
#track-artist{font-size:15px;color:var(--champagne);opacity:.8;margin-bottom:20px;min-height:1.4em;}
.viz{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:44px;margin:6px 0 24px;}
.viz span{width:4px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--gold-dim));height:6px;transition:height .12s ease-out;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:22px;}
.ctrl-btn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--ink);box-shadow:0 10px 26px rgba(255,217,142,0.35);font-size:18px;transition:transform .3s var(--ease);}
.ctrl-btn:hover{transform:scale(1.08);}
.ctrl-btn.small{width:38px;height:38px;background:transparent;color:var(--cream);box-shadow:none;border:1px solid var(--glass-brd);}
.seek-row{display:flex;align-items:center;gap:10px;margin-top:22px;font-family:'Inter',sans-serif;font-size:11px;color:var(--champagne);}
#seek{flex:1;appearance:none;height:3px;border-radius:2px;background:rgba(232,199,126,0.25);outline:none;}
#seek::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;}
.music-note{margin-top:16px;font-size:13px;font-family:'Inter',sans-serif;color:rgba(247,236,217,0.5);}

/* ============================ FINALE SCREEN ============================ */
#fireworks-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.balloon{position:absolute;bottom:-140px;width:46px;height:58px;border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;animation:rise linear infinite;opacity:.9;}
.balloon::after{content:"";position:absolute;left:50%;bottom:-46px;width:1px;height:46px;background:rgba(255,255,255,0.25);transform:translateX(-50%);}
@keyframes rise{0%{transform:translateY(0) translateX(0);}50%{transform:translateY(-60vh) translateX(20px);}100%{transform:translateY(-125vh) translateX(-10px);}}
.finale-content{position:relative;z-index:2;text-align:center;}
#hb-banner{font-size:clamp(38px,7.6vw,80px);font-weight:700;margin-bottom:22px;line-height:1.05;min-height:1.1em;}
.final-tablet{width:min(560px,90vw);margin:20px auto 0;padding:32px 38px;}
#final-message{font-size:19px;line-height:1.8;font-style:italic;color:rgba(247,236,217,0.92);min-height:5em;}
.final-sign{margin-top:18px;font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);font-size:20px;min-height:1.4em;}
#replay-btn{margin-top:32px;}

@media (max-width:640px){
  .glass-panel{border-radius:16px;}
  .scroll-frame{padding:42px 24px 34px;}
  .tier1{width:190px;height:64px;} .tier2{width:145px;height:54px;} .tier3{width:100px;height:46px;}
  .slide-caption{bottom:128px;}
  .icon-stage{width:150px;height:150px;}
  .hex-pedestal{width:120px;height:68px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

/* =====================================================================
   TYPEWRITER — text appears letter by letter, as if being written live.
===================================================================== */
function typeInto(el, text, speed=26, onDone){
  el.textContent = "";
  const cursor = document.createElement("span");
  cursor.className = "typing-cursor";
  el.appendChild(cursor);
  let i = 0;
  (function step(){
    if(i < text.length){
      el.insertBefore(document.createTextNode(text[i]), cursor);
      i++;
      setTimeout(step, speed);
    }else{
      cursor.remove();
      if(onDone) onDone();
    }
  })();
}
function typeSequence(triples, gap=250, onAllDone){
  let idx = 0;
  (function next(){
    if(idx >= triples.length){ if(onAllDone) onAllDone(); return; }
    const [el, text, speed] = triples[idx];
    typeInto(el, text, speed || 26, ()=>{ idx++; setTimeout(next, gap); });
  })();
}

/* =====================================================================
   BIG CENTERED EMOJI REACTION

function showBigEmoji(emoji){

  el.textContent = emoji;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1750);
}

/* =====================================================================
   PROCEDURAL "PAINTERLY GLOW" ATMOSPHERE — bokeh field + faint network
   lines behind every screen, colour-matched to that section's mood.
===================================================================== */
function buildAtmos(screenEl, colorHex, count){
  const atmos = document.createElement('div');
  atmos.className = 'atmos';
  const pts = [];
  const n = count || 7;
  for(let i=0;i<n;i++){
    const size = 70 + Math.random()*170;
    const x = Math.random()*100, y = Math.random()*100;
    pts.push([x,y]);
    const b = document.createElement('span');
    b.className = 'bokeh';
    b.style.width = size+'px'; b.style.height = size+'px';
    b.style.left = x+'%'; b.style.top = y+'%';
    b.style.background = `radial-gradient(circle, ${colorHex}, transparent 72%)`;
    b.style.animationDuration = (7+Math.random()*8)+'s';
    b.style.animationDelay = (Math.random()*6)+'s';
    atmos.appendChild(b);
  }
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1', pts[i][0]+'%'); line.setAttribute('y1', pts[i][1]+'%');
    line.setAttribute('x2', pts[j][0]+'%'); line.setAttribute('y2', pts[j][1]+'%');
    line.setAttribute('stroke', colorHex); line.setAttribute('stroke-width','1');
    svg.appendChild(line);
  }
  atmos.appendChild(svg);
  screenEl.insertBefore(atmos, screenEl.firstChild);
}

/* Accepts any common picture format. If a CONFIG image path is given WITH
   an extension (e.g. "assets/images/photo-01.png"), that exact file is
   used. If given WITHOUT an extension (e.g. "assets/images/photo-01"),
   this automatically tries each of these extensions in turn until one
   exists — so you can drop in a .jpg, .jpeg, .png, .webp, .gif, .avif,
   or .bmp file without editing CONFIG or matching a specific extension. */
const IMAGE_EXTENSIONS=['jpg','jpeg','png','webp','gif','avif','bmp','JPG','JPEG','PNG','WEBP'];
function resolveImageSrc(basePath, onFound, onFail){
  if(/\.[a-zA-Z0-9]+$/.test(basePath)){
    const test=new Image();
    test.onload=()=>onFound(basePath);
    test.onerror=onFail;
    test.src=basePath;
    return;
  }
  let i=0;
  (function tryNext(){
    if(i>=IMAGE_EXTENSIONS.length){ onFail(); return; }
    const candidate=`${basePath}.${IMAGE_EXTENSIONS[i]}`;
    i++;
    const test=new Image();
    test.onload=()=>onFound(candidate);
    test.onerror=tryNext;
    test.src=candidate;
  })();
}

/* Applies a custom full-page background image for the given screen if one
   was set in CONFIG.pageBackgrounds, otherwise falls back to the default
   procedurally-drawn design. */
const _bgImageCache = {}; // avoids re-resolving the same background image path more than once
function updatePageBackground(id){
  const layer = document.getElementById('page-bg-layer');
  const path = CONFIG.pageBackgrounds && CONFIG.pageBackgrounds[id];
  if(!path){ layer.classList.remove('show'); return; }
  const cached = _bgImageCache[path];
  if(cached === 'fail'){ layer.classList.remove('show'); return; }
  if(cached){ layer.style.backgroundImage = `url("${cached}")`; layer.classList.add('show'); return; }
  // resolve first (trying multiple picture formats if needed) so a broken/
  // missing file just quietly falls back to the default glowing design
  // instead of showing a blank page
  resolveImageSrc(path,
    (foundUrl)=>{ _bgImageCache[path]=foundUrl; if(currentScreenId===id){ layer.style.backgroundImage = `url("${foundUrl}")`; layer.classList.add('show'); } },
    ()=>{ _bgImageCache[path]='fail'; if(currentScreenId===id) layer.classList.remove('show'); }
  );
}

// Pauses every <audio> element on the page. Called at the very start of
// every page transition so no music/song can ever carry over to the next page.
function stopAllAudio(){
  document.querySelectorAll('audio').forEach(a=>{ if(!a.paused) a.pause(); });
}
function goTo(id){
  const next = document.getElementById(id);
  if(!next || id === currentScreenId) return;
  stopAllAudio();
  const cur = document.getElementById(currentScreenId);
  if(cur){ cur.classList.remove('active'); cur.classList.add('leaving'); setTimeout(()=>cur.classList.remove('leaving'), 900); }
  next.classList.add('active');
  currentScreenId = id;
  updateNavDots();
  updatePageBackground(id);
  document.getElementById('bg-gradient').style.filter = `hue-rotate(${ZONE_HUE[BG_ZONES[id]??0]}deg)`;
  if(!enteredScreens.has(id)){ enteredScreens.add(id); onScreenFirstEnter(id); }
}
function updateNavDots(){
  const topic = TOPIC_MAP[currentScreenId];
  document.querySelectorAll('#nav-dots button').forEach(d=> d.classList.toggle('active', d.dataset.target === topic));
}

let scrollProgressForBg = 0;
(function initParticles(){
  const canvas = document.getElementById('bg-canvas');
  if(!window.THREE || matchMedia('(prefers-reduced-motion: reduce)').matches){ canvas.style.display='none'; return; }
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 12;
  const COUNT = window.innerWidth < 700 ? 380 : 800;
  const positions = new Float32Array(COUNT*3);
  const speeds = new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    positions[i*3]=(Math.random()-0.5)*30; positions[i*3+1]=(Math.random()-0.5)*20; positions[i*3+2]=(Math.random()-0.5)*20;
    speeds[i]=0.15+Math.random()*0.35;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const sprite = (function(){
    const c=document.createElement('canvas'); c.width=c.height=64; const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,246,224,1)'); g.addColorStop(0.4,'rgba(255,217,142,0.9)'); g.addColorStop(1,'rgba(255,217,142,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  })();
  const mat = new THREE.PointsMaterial({size:0.4, map:sprite, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color:new THREE.Color('#ffdc9e'), opacity:0.85});
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  let mouseX=0, mouseY=0;
  window.addEventListener('mousemove', e=>{ mouseX=(e.clientX/window.innerWidth-0.5); mouseY=(e.clientY/window.innerHeight-0.5); });
  const palette = ZONE_COLORS.map(c=> new THREE.Color(c));
  function tick(){
    const t = performance.now()*0.00005;
    const posAttr = geo.attributes.position;
    for(let i=0;i<COUNT;i++){ posAttr.array[i*3+1]+=speeds[i]*0.01; if(posAttr.array[i*3+1]>10) posAttr.array[i*3+1]=-10; }
    posAttr.needsUpdate = true;
    points.rotation.y = t + scrollProgressForBg*1.2;
    camera.position.x += (mouseX*1.5 - camera.position.x)*0.02;
    camera.position.y += (-mouseY*1.5 - camera.position.y)*0.02;
    camera.lookAt(0,0,0);
    const zoneF = Math.min(scrollProgressForBg*5,4);
    const i0=Math.floor(zoneF), i1=Math.min(i0+1,4), f=zoneF-i0;
    mat.color = palette[i0].clone().lerp(palette[i1], f);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
  window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
})();

function mount3DIcon(canvasId, type){
  const canvas = document.getElementById(canvasId);
  if(!window.THREE || !canvas || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  const size = canvas.clientWidth || 230;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(size, size, false);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
  camera.position.set(0,0,7);
  const key = new THREE.PointLight(0xffe4b0, 1.8); key.position.set(4,4,6); scene.add(key);
  const fill = new THREE.PointLight(0xf2a6b3, 0.9); fill.position.set(-4,-2,4); scene.add(fill);
  scene.add(new THREE.AmbientLight(0x332018, 1.1));
  const goldMat = new THREE.MeshStandardMaterial({ color:0xffd98e, metalness:0.55, roughness:0.28, emissive:0x3a2308, emissiveIntensity:0.45 });
  const blushMat = new THREE.MeshStandardMaterial({ color:0xf2a6b3, metalness:0.35, roughness:0.4, emissive:0x2a0d14, emissiveIntensity:0.3 });
  let mesh;
  if(type==='heart'){
    const shape = new THREE.Shape();
    shape.moveTo(0,0.6);
    shape.bezierCurveTo(0,1.1,-0.9,1.2,-0.9,0.45);
    shape.bezierCurveTo(-0.9,-0.2,0,-0.7,0,-1.3);
    shape.bezierCurveTo(0,-0.7,0.9,-0.2,0.9,0.45);
    shape.bezierCurveTo(0.9,1.2,0,1.1,0,0.6);
    const geo = new THREE.ExtrudeGeometry(shape, {depth:0.5, bevelEnabled:true, bevelThickness:0.12, bevelSize:0.1, bevelSegments:4, curveSegments:24});
    geo.center();
    mesh = new THREE.Mesh(geo, goldMat);
  }else if(type==='cake'){
    const grp = new THREE.Group();
    [[1.4,0.5,0],[1.05,0.45,0.5],[0.7,0.4,0.95]].forEach(([r,h,y])=>{
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.05,h,28), goldMat); m.position.y=y; grp.add(m);
    });
    for(let i=0;i<5;i++){
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.35,8), blushMat);
      const a=(i/5)*Math.PI*2; c.position.set(Math.cos(a)*0.35,1.35,Math.sin(a)*0.35); grp.add(c);
    }
    mesh = grp;
  }else if(type==='gallery'){
    const grp = new THREE.Group();
    for(let i=0;i<3;i++){
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.3,1.6,0.06), i===1?goldMat:blushMat);
      m.position.set((i-1)*0.55,0,-i*0.3); m.rotation.y=(i-1)*0.35; grp.add(m);
    }
    mesh = grp;
  }else if(type==='vinyl'){
    const grp = new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,0.08,48), new THREE.MeshStandardMaterial({color:0x0d0d10, metalness:0.6, roughness:0.35})));
    const label = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.1,32), goldMat); label.position.y=0.02; grp.add(label);
    mesh = grp; mesh.rotation.x = Math.PI/2.6;
  }else{
    const grp = new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.22,0), goldMat));
    for(let i=0;i<14;i++){
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), i%2?goldMat:blushMat);
      const phi=Math.acos(2*Math.random()-1), theta=Math.random()*Math.PI*2, r=1.2;
      s.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
      grp.add(s);
    }
    mesh = grp;
  }
  scene.add(mesh);
  function animate(){
    mesh.rotation.y += 0.012;
    mesh.rotation.x = 0.15 + Math.sin(performance.now()*0.0006)*0.08;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize', ()=>{ const s = canvas.clientWidth || 230; renderer.setSize(s,s,false); });
}

let cakeInitialized=false;
function initCake(){
  if(cakeInitialized) return; cakeInitialized=true;
  typeSequence([[document.getElementById('cakeTitle'),CONFIG.cakeTitle,30],[document.getElementById('cake-hint'),CONFIG.cakeHint,22]]);
  const wrap=document.getElementById('candles');
  const count=Math.max(1,CONFIG.candleCount|0);
  for(let i=0;i<count;i++){ const c=document.createElement('div'); c.className='candle'; c.innerHTML='<div class="flame"></div><div class="smoke"></div>'; wrap.appendChild(c); }
  const candles=wrap.querySelectorAll('.candle');
  const hint=document.getElementById('cake-hint'), cta=document.getElementById('cake-cta'), dance=document.getElementById('danceRow');
  let lit=candles.length, finished=false;
  function finish(){
    if(finished) return; finished=true;
    hint.textContent='wish made. ✨';
    showBigEmoji(CONFIG.cakeDoneEmoji);
    goldConfettiCannon(); burstHearts(0.4);
    dance.classList.add('show'); setTimeout(()=>dance.classList.remove('show'),3200);
    setTimeout(()=>cta.classList.add('show'),500);
  }
  candles.forEach(c=> c.addEventListener('click', ()=>{ if(c.classList.contains('out')) return; c.classList.add('out'); lit--; if(lit===0) finish(); }));
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    let micArmed=false;
    document.getElementById('cake').addEventListener('mouseenter', async ()=>{
      if(micArmed||finished) return; micArmed=true;
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const src=ctx.createMediaStreamSource(stream);
        const analyser=ctx.createAnalyser(); analyser.fftSize=512;
        src.connect(analyser);
        const data=new Uint8Array(analyser.frequencyBinCount);
        let strong=0;
        (function poll(){
          if(finished){ stream.getTracks().forEach(t=>t.stop()); return; }
          analyser.getByteFrequencyData(data);
          const low=data.slice(0,10).reduce((a,b)=>a+b,0)/10;
          if(low>140) strong++; else strong=Math.max(0,strong-1);
          if(strong>8){
            const next=wrap.querySelector('.candle:not(.out)');
            if(next){ next.classList.add('out'); lit--; strong=0; if(lit===0){ finish(); stream.getTracks().forEach(t=>t.stop()); } }
          }
          requestAnimationFrame(poll);
        })();
      }catch(err){}
    }, {once:true});
  }
}

/* =====================================================================
   GALLERY — CINEMATIC 4-TRANSITION SLIDESHOW ENGINE
   whip-pan (motion blur), hard-cut, zoom-in punch, and a sliding keyframe
   swipe — cycling automatically across photos. Each photo always displays
   at its true, fully-visible size (no cropping/zooming past 100%).
===================================================================== */
let galleryInitialized=false;
function initGallery(){
  if(galleryInitialized) return; galleryInitialized=true;

  const layers=[document.getElementById('slideA'), document.getElementById('slideB')];
  let activeLayer=0;
  const photos=CONFIG.photos;
  const caption=document.getElementById('slideCaption');
  const counter=document.getElementById('slideCounter');
  const progressWrap=document.getElementById('slideProgress');
  const checkpoint=document.getElementById('galleryCheckpoint');

  photos.forEach(()=>{ const i=document.createElement('i'); i.innerHTML='<b></b>'; progressWrap.appendChild(i); });
  const bars=progressWrap.querySelectorAll('i');

  // 'zoom-out' was removed — it briefly scaled photos past 100%, which
  // clipped their edges. The remaining transitions never scale a photo
  // beyond its normal, fully-visible size.
  const TYPES=['whip-pan','hard-cut','zoom-in','slide'];
  const HOLD_MS = CONFIG.slideSeconds*1000;
  const TRANS_MS = Math.min(420, HOLD_MS*0.4);

  function placeholderHTML(cap){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L9 17"/></svg><span>${cap||'Add a photo'}</span>`;
  }
  const _photoCache={}; // remembers which photo urls have already resolved / failed
  // Any common picture format works here — resolveImageSrc (defined earlier,
  // shared with page backgrounds) automatically tries .jpg/.jpeg/.png/.webp/
  // .gif/.avif/.bmp for any CONFIG.photos entry given without an extension.
  function paint(layerEl, photo){
    if(!photo.src){
      layerEl.style.backgroundImage = 'none';
      layerEl.classList.add('is-placeholder');
      layerEl.innerHTML = placeholderHTML(photo.caption);
      return;
    }
    const state = _photoCache[photo.src];
    if(state === 'fail'){
      layerEl.style.backgroundImage = 'none';
      layerEl.classList.add('is-placeholder');
      layerEl.innerHTML = placeholderHTML(photo.caption || 'Photo unavailable');
      return;
    }
    if(state){ // already-resolved actual URL string
      layerEl.style.backgroundImage = `url("${state}")`;
      layerEl.classList.remove('is-placeholder');
      layerEl.innerHTML = '';
      return;
    }
    // first time seeing this photo — resolve its real file (trying multiple
    // extensions if needed) so a broken/missing file shows the placeholder
    // tile instead of an empty full-screen slide
    layerEl.style.backgroundImage = 'none';
    layerEl.classList.add('is-placeholder');
    layerEl.innerHTML = placeholderHTML(photo.caption);
    layerEl.dataset.src = photo.src;
    resolveImageSrc(photo.src,
      (foundUrl)=>{
        _photoCache[photo.src]=foundUrl;
        if(layerEl.dataset.src===photo.src){ layerEl.style.backgroundImage = `url("${foundUrl}")`; layerEl.classList.remove('is-placeholder'); layerEl.innerHTML=''; }
      },
      ()=>{
        _photoCache[photo.src]='fail';
        if(layerEl.dataset.src===photo.src){ layerEl.innerHTML = placeholderHTML(photo.caption || 'Photo unavailable'); }
      }
    );
  }
  function resetLayerStyle(el){ el.style.transition='none'; el.style.filter='none'; }

  // Ken Burns continuous zoom removed — it slowly scaled photos past 100%
  // over each slide's on-screen time, which clipped their edges by the end.
  // Photos now stay at their true, fully-visible size the whole time they're shown.

  let idx=-1, playing=true, timer=null;

  function setBar(i){
    bars.forEach((b,k)=>{
      b.classList.toggle('done', k<i);
      if(k===i){ const barEl=b.querySelector('b'); barEl.style.transition='none'; barEl.style.width='0'; void barEl.offsetWidth; barEl.style.transition=`width ${HOLD_MS}ms linear`; barEl.style.width='100%'; }
      else if(k>i){ const barEl=b.querySelector('b'); barEl.style.transition='none'; barEl.style.width='0'; }
    });
  }

  function showCaption(text){
    caption.style.opacity=0;
    setTimeout(()=>{ caption.textContent=text||''; caption.style.opacity = text? 1:0; }, 120);
  }

  function transitionTo(nextIdx){
    const type = TYPES[nextIdx % TYPES.length];
    const incoming = layers[1-activeLayer];
    const outgoing = layers[activeLayer];
    const photo = photos[nextIdx];
    paint(incoming, photo);
    resetLayerStyle(incoming); resetLayerStyle(outgoing);
    incoming.style.zIndex=2; outgoing.style.zIndex=1;

    if(type==='hard-cut'){
      incoming.style.opacity=1; incoming.style.transform='none';
      outgoing.style.opacity=0;
    }else if(type==='whip-pan'){
      const dir = nextIdx%2===0 ? 1 : -1;
      incoming.style.opacity=1; incoming.style.transform=`translateX(${dir*55}%)`; incoming.style.filter='blur(26px)';
      outgoing.style.opacity=1;
      void incoming.offsetWidth;
      incoming.style.transition=`transform ${TRANS_MS}ms cubic-bezier(.2,.8,.2,1), filter ${TRANS_MS}ms linear`;
      outgoing.style.transition=`transform ${TRANS_MS}ms cubic-bezier(.2,.8,.2,1), filter ${TRANS_MS}ms linear, opacity 120ms ${TRANS_MS-100}ms`;
      requestAnimationFrame(()=>{
        incoming.style.transform='translateX(0)'; incoming.style.filter='blur(0)';
        outgoing.style.transform=`translateX(${-dir*55}%)`; outgoing.style.filter='blur(26px)';
        outgoing.style.opacity=0;
      });
    }else if(type==='zoom-in'){
      incoming.style.opacity=1; incoming.style.transform='scale(0.55)';
      outgoing.style.opacity=1;
      void incoming.offsetWidth;
      incoming.style.transition=`transform ${TRANS_MS}ms cubic-bezier(.34,1.56,.64,1)`;
      outgoing.style.transition=`opacity ${TRANS_MS*0.55}ms ease`;
      requestAnimationFrame(()=>{ incoming.style.transform='scale(1)'; outgoing.style.opacity=0; });
    }else if(type==='slide'){
      const dir = nextIdx%2===0 ? 1 : -1;
      incoming.style.opacity=1; incoming.style.transform=`translateY(${dir*100}%)`;
      outgoing.style.opacity=1;
      void incoming.offsetWidth;
      incoming.style.transition=`transform ${TRANS_MS}ms var(--ease)`;
      outgoing.style.transition=`transform ${TRANS_MS}ms var(--ease), opacity 120ms ${TRANS_MS-100}ms`;
      requestAnimationFrame(()=>{
        incoming.style.transform='translateY(0)';
        outgoing.style.transform=`translateY(${-dir*100}%)`;
        outgoing.style.opacity=0;
      });
    }

    activeLayer = 1-activeLayer;
    idx = nextIdx;
    showCaption(photo.caption);
    counter.textContent = `${nextIdx+1} / ${photos.length}`;
    setBar(nextIdx);
    resetTimer();
  }

  function resetTimer(){
    clearTimeout(timer);
    if(!playing) return;
    timer = setTimeout(()=>{
      if(idx >= photos.length-1) openCheckpoint();
      else transitionTo(idx+1);
    }, HOLD_MS);
  }
  function openCheckpoint(){
    playing=false; clearTimeout(timer);
    document.getElementById('checkpointQ').textContent='';
    typeInto(document.getElementById('checkpointQ'), CONFIG.checkpointQuestion, 26);
    checkpoint.classList.add('show');
  }

  document.getElementById('slidePrev').addEventListener('click', ()=>{ if(idx>0) transitionTo(idx-1); });
  document.getElementById('slideNext').addEventListener('click', ()=>{ if(idx<photos.length-1) transitionTo(idx+1); else openCheckpoint(); });
  const playPauseBtn=document.getElementById('slidePlayPause');
  playPauseBtn.addEventListener('click', ()=>{
    playing=!playing; playPauseBtn.textContent = playing? '❚❚':'▶';
    if(playing) resetTimer(); else clearTimeout(timer);
  });
  document.getElementById('checkYes').addEventListener('click', ()=>{
    showBigEmoji(CONFIG.checkpointYesEmoji); burstHearts(0.6);
    document.getElementById('checkpoint-response').textContent = CONFIG.checkpointYesResponse;
  });
  document.getElementById('checkNo').addEventListener('click', ()=>{
    showBigEmoji(CONFIG.checkpointNoEmoji);
    document.getElementById('checkpoint-response').textContent = CONFIG.checkpointNoResponse;
  });

  const galleryAudio=document.getElementById('galleryAudio');
  const soundBtn=document.getElementById('slideSound');
  const musicSrc=CONFIG.galleryMusicSrc || CONFIG.musicTrack.src;
  let soundOn=false;
  if(musicSrc){
    galleryAudio.src=musicSrc; galleryAudio.volume=0.55;
    galleryAudio.play().then(()=>{ soundOn=true; soundBtn.textContent='🔊'; }).catch(()=>{ soundOn=false; soundBtn.textContent='🔈'; });
    // if the track can't actually load (e.g. a blocked Drive link), dim the
    // button so it doesn't sit there implying music that will never play
    galleryAudio.addEventListener('error', ()=>{ soundBtn.style.opacity=0.4; soundBtn.title='Music unavailable'; }, { once:true });
  }else{ soundBtn.style.opacity=0.4; }
  soundBtn.addEventListener('click', ()=>{
    if(!musicSrc) return;
    if(soundOn){ galleryAudio.pause(); soundOn=false; soundBtn.textContent='🔈'; }
    else{ galleryAudio.play().then(()=>{ soundOn=true; soundBtn.textContent='🔊'; }).catch(()=>{}); }
  });

  // first photo, no transition
  paint(layers[activeLayer], photos[0]);
  layers[activeLayer].style.opacity=1; layers[activeLayer].style.zIndex=2; layers[activeLayer].style.transform='none'; layers[activeLayer].style.filter='none';
  idx=0; showCaption(photos[0].caption); counter.textContent=`1 / ${photos.length}`; setBar(0);
  resetTimer();
}

/* =====================================================================
   MUSIC PLAYER LOGIC
===================================================================== */
let playerInitialized=false;
function initPlayer(){
  if(playerInitialized) return; playerInitialized=true;
  typeSequence([[document.getElementById('track-title'),CONFIG.musicTrack.title,30],[document.getElementById('track-artist'),CONFIG.musicTrack.artist,22]]);
  const audio=document.getElementById('audio'), vinyl=document.getElementById('vinyl'), tonearm=document.getElementById('tonearm');
  const btnPlay=document.getElementById('btnPlay'), btnBack=document.getElementById('btnBack'), btnMute=document.getElementById('btnMute');
  const seek=document.getElementById('seek'), curTime=document.getElementById('curTime'), durTime=document.getElementById('durTime');
  const note=document.getElementById('musicNote'), vizWrap=document.getElementById('viz');
  for(let i=0;i<28;i++) vizWrap.appendChild(document.createElement('span'));
  const bars=vizWrap.querySelectorAll('span');
  const hasTrack=!!CONFIG.musicTrack.src;
  const musicCta=document.getElementById('musicCta');
  let ctaRevealed=false;
  function revealMusicCta(){ if(ctaRevealed) return; ctaRevealed=true; musicCta.classList.add('show'); }
  if(hasTrack){
    audio.src=CONFIG.musicTrack.src; note.style.display='none';
    const minListen=(CONFIG.minListenSeconds||15)*1000;
    audio.addEventListener('timeupdate', ()=>{ if(audio.currentTime*1000 >= Math.min(minListen, (audio.duration||minListen)*1000*0.9)) revealMusicCta(); });
    audio.addEventListener('ended', revealMusicCta);
    // if the track can't load at all (e.g. a blocked Drive link), don't
    // leave the visitor stuck — disable play and reveal the next-page button
    audio.addEventListener('error', ()=>{
      btnPlay.disabled=true; btnPlay.style.opacity=0.5; btnPlay.style.cursor='not-allowed';
      note.style.display='block'; typeInto(note, CONFIG.musicPlaceholderNote, 20, revealMusicCta);
    }, { once:true });
  }else{
    btnPlay.disabled=true; btnPlay.style.opacity=0.5; btnPlay.style.cursor='not-allowed';
    typeInto(note, CONFIG.musicPlaceholderNote, 20, revealMusicCta);
  }
  function fmt(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }
  let analyser,dataArr,audioCtx,sourceNode,wired=false;
  function wireAnalyser(){
    if(wired) return;
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      sourceNode=audioCtx.createMediaElementSource(audio);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=64;
      dataArr=new Uint8Array(analyser.frequencyBinCount);
      sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
      wired=true;
    }catch(err){ wired=false; }
  }
  let playing=false;
  function renderViz(){
    if(!playing) return;
    if(analyser){ analyser.getByteFrequencyData(dataArr); bars.forEach((bar,i)=>{ const v=dataArr[i%dataArr.length]||0; bar.style.height=Math.max(6,(v/255)*44)+'px'; }); }
    else{ bars.forEach(bar=>{ bar.style.height=(6+Math.random()*30)+'px'; }); }
    requestAnimationFrame(renderViz);
  }
  btnPlay.addEventListener('click', async ()=>{
    if(!hasTrack) return;
    if(audio.paused){ wireAnalyser(); if(audioCtx && audioCtx.state==='suspended') await audioCtx.resume(); audio.play().catch(()=>{}); }
    else audio.pause();
  });
  audio.addEventListener('play', ()=>{ playing=true; btnPlay.textContent='❚❚'; vinyl.classList.add('playing'); tonearm.classList.add('playing'); renderViz(); });
  audio.addEventListener('pause', ()=>{ playing=false; btnPlay.textContent='▶'; vinyl.classList.remove('playing'); tonearm.classList.remove('playing'); });
  audio.addEventListener('loadedmetadata', ()=>{ durTime.textContent=fmt(audio.duration); });
  audio.addEventListener('timeupdate', ()=>{ curTime.textContent=fmt(audio.currentTime); if(audio.duration) seek.value=(audio.currentTime/audio.duration)*100; });
  seek.addEventListener('input', ()=>{ if(audio.duration) audio.currentTime=(seek.value/100)*audio.duration; });
  btnBack.addEventListener('click', ()=>{ audio.currentTime=0; });
  let muted=false;
  btnMute.addEventListener('click', ()=>{ muted=!muted; audio.muted=muted; btnMute.textContent=muted?'🔇':'🔊'; });
}

/* =====================================================================
   FINALE LOGIC
===================================================================== */
let finaleInitialized=false;
function initFinale(){
  if(finaleInitialized) return; finaleInitialized=true;
  document.getElementById('finaleEyebrow').textContent = CONFIG.finaleEyebrow || '';
  typeInto(document.getElementById('hb-banner'), 'HAPPY BIRTHDAY!', 36);
  const balloonLayer=document.getElementById('balloonLayer');
  balloonLayer.style.position='absolute'; balloonLayer.style.inset='0'; balloonLayer.style.overflow='hidden'; balloonLayer.style.pointerEvents='none';
  const balloonColors=['#ffd98e','#f2a6b3','#e8c77e','#fff0d6'];
  for(let i=0;i<12;i++){
    const b=document.createElement('div'); b.className='balloon';
    const size=34+Math.random()*26;
    b.style.width=size+'px'; b.style.height=(size*1.25)+'px'; b.style.left=(Math.random()*94)+'%';
    b.style.animationDuration=(9+Math.random()*8)+'s'; b.style.animationDelay=(Math.random()*10)+'s';
    const color=balloonColors[i%balloonColors.length];
    b.style.background=`radial-gradient(circle at 32% 28%, #fff8, transparent 40%), radial-gradient(circle at 50% 55%, ${color}, ${color})`;
    b.style.boxShadow='inset -6px -10px 16px rgba(0,0,0,0.15)';
    balloonLayer.appendChild(b);
  }
  const canvas=document.getElementById('fireworks-canvas'); const ctx=canvas.getContext('2d');
  function resize(){ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; }
  resize(); window.addEventListener('resize', resize);
  let particles=[];
  const fwColors=['#ffd98e','#f2a6b3','#fff6e0','#e8c77e','#ff9fb0'];
  function explode(x,y){
    for(let i=0;i<46;i++){
      const angle=(Math.PI*2*i)/46, speed=2+Math.random()*3.4;
      particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:fwColors[Math.floor(Math.random()*fwColors.length)]});
    }
  }
  function loop(){
    ctx.fillStyle='rgba(10,2,5,0.18)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.035; p.life-=0.014; ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1; particles=particles.filter(p=>p.life>0);
    requestAnimationFrame(loop);
  }
  loop();
  explode(canvas.width*0.5, canvas.height*0.35);
  setInterval(()=>{ explode(Math.random()*canvas.width*0.8+canvas.width*0.1, Math.random()*canvas.height*0.5+canvas.height*0.1); }, 1400);
  setTimeout(()=>{
    typeInto(document.getElementById('final-message'), CONFIG.finalMessage, 22, ()=>{
      typeInto(document.getElementById('finalSign'), CONFIG.finalSign, 26);
    });
  }, 900);
  document.getElementById('replay-btn').addEventListener('click', ()=>{
    showBigEmoji(CONFIG.replayEmoji);
    goldConfettiCannon(); burstHearts(0.5);
    explode(canvas.width*0.5, canvas.height*0.4);
    explode(canvas.width*0.25, canvas.height*0.5);
    explode(canvas.width*0.75, canvas.height*0.5);
  });
}

/* =====================================================================
   WHOLE-SITE BACKGROUND MUSIC — separate from the "Our Song" music page
   and the gallery's own track. Hidden automatically if CONFIG.backgroundMusicSrc
   is left blank. Never autoplays (browsers block that); the visitor taps it on.
===================================================================== */
(function initBgMusic(){
  const btn=document.getElementById('bgMusicToggle'), audio=document.getElementById('bgMusicAudio');
  if(!CONFIG.backgroundMusicSrc){ btn.style.display='none'; return; }
  audio.src=CONFIG.backgroundMusicSrc; audio.volume=0.35;
  audio.addEventListener('error', ()=>{ btn.style.display='none'; }, { once:true });
  let on=false;
  btn.addEventListener('click', ()=>{
    if(on){ audio.pause(); on=false; btn.textContent='🔈 Music'; }
    else{ audio.play().then(()=>{ on=true; btn.textContent='🔊 Music'; }).catch(()=>{}); }
  });
})();
</script>
